.nx .rb{width:46px;height:46px;flex:none;padding:0;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer}.nx .rb svg{width:22px;height:22px}.nx .rb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.nx .ls>.hd b#nT{flex:0 0 100%;order:5;font-size:34px;font-weight:800;letter-spacing:-.03em;margin:14px 2px 2px}
.nx .ed>.hd{padding:12px 16px 0}.nx .nmo{position:absolute;z-index:20;min-width:210px;background:var(--win);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.nx .nmo button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;font:500 15px var(--font);color:var(--ink);text-align:left}.nx .nmo button:hover{background:var(--soft)}.nx .nmo svg{width:18px;height:18px;color:var(--accent)}
@media (max-width:760px){.nx aside,.nx .ls,.nx .ed{width:100%;border:0}.nx[data-v="f"] .ls,.nx[data-v="f"] .ed,.nx[data-v="l"] aside,.nx[data-v="l"] .ed,.nx[data-v="e"] aside,.nx[data-v="e"] .ls{display:none}.nx .bk{display:flex;color:var(--accent);font-size:16px;align-items:center;gap:2px}.nx .bk.rb{display:grid;color:var(--ink)}.nx .ed>.hd.bk{display:flex}.nx .ed textarea,.nx .ed .vw,.nx .rt{padding:12px 18px}.nx .tb{padding:8px 12px}.nx .ed .dt,.nx .ed h2,.nx .ed .ro{margin-left:18px;margin-right:18px}}
.dlg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px}
.dlg div{background:var(--soft);border-radius:20px;padding:20px;width:min(320px,100%);display:grid;gap:12px}
.dlg input{font:600 28px var(--font);text-align:center;background:var(--win);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px}
.dlg button{border:0;border-radius:12px;padding:12px;background:var(--accent);color:#fff;font:600 15px var(--font)}

    if(!manual&&L.getItem("lc.ota.ver")!==U.version){try{await idbPut(U.h);L.setItem("lc.ota.ver",U.version);L.removeItem("lc.ota.try");toast("Mise à jour v"+U.version+" téléchargée — appliquée au prochain démarrage")}catch(e){}}
    if(!manual&&L.getItem("lc.ota.skip")===U.version&&Date.now()-(+L.getItem("lc.ota.skipAt")||0)<12*36e5)return;
    var d=box("<h4>Mise à jour disponible</h4><div>Version "+esc(U.version)+" (vous avez la "+esc(LC_VER)+")</div><div class='b'><button id='lcL'>Plus tard</button><button class='p' id='lcG'>Installer</button></div>");
    d.querySelector("#lcL").onclick=function(){L.setItem("lc.ota.skip",U.version);L.setItem("lc.ota.skipAt",Date.now());close()};
    d.querySelector("#lcG").onclick=function(){get(U)};
  }catch(e){if(manual)toast("Vérification impossible pour l'instant")}finally{busy=false}
}
async function get(U){
  try{await idbPut(U.h);L.setItem("lc.ota.ver",U.version);L.removeItem("lc.ota.try");
    box("<h4>Mise à jour prête</h4><div>La version "+esc(U.version)+" est installée. L'application va redémarrer.</div><div class='b'><button class='p' id='lcR'>Redémarrer</button></div>").querySelector("#lcR").onclick=function(){location.reload()};
  }catch(e){box("<h4>Échec de l'installation</h4><div>Réessayez plus tard.</div><div class='b'><button id='lcX'>Fermer</button></div>").querySelector("#lcX").onclick=close}
}
window.lcCheckUpdate=function(){var u=window.lcUpd;u?get(u.U):check(true)};
try{L.removeItem("lc.ota.try")}catch(e){}setTimeout(check,3000);window.addEventListener("online",function(){setTimeout(check,2000)});setInterval(check,6*36e5);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&Date.now()-last>36e5)check()});
})()</script>
<script>document.addEventListener("pointerdown",e=>{const b=e.target.closest(".nx .tb button,.nx .tb label");if(!b)return;b.classList.remove("tp");void b.offsetWidth;b.classList.add("tp")});document.addEventListener("animationend",e=>{e.target.classList&&e.target.classList.remove("tp")})</script>
